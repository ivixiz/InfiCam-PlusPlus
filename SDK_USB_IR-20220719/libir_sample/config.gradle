/* 必须ext，定义所有project公用参数 */
ext {

    //===
    android = [
            compileSdkVer       : 29,// 用于编译的SDK版本
            buildToolsVer       : "29.0.3",// 用于Gradle编译项目的工具版本
            // SDK version info
            versionCodeUSBIR    : 124,
            versionNameUSBIR    : "1.2.4",
            versionCodeMINI640  : 124,
            versionNameMINI640  : "1.2.4",
            versionCodeMINI640V2: 100,
            versionNameMINI640V2: "1.0.0",
            versionCodeUSBDual  : 124,
            versionNameUSBDual  : "1.2.4",
            versionCodeSPIIR    : 124,
            versionNameSPIIR    : "1.2.4",
            versionCodeSPIDual  : 124,
            versionNameSPIDual  : "1.2.4",
            versionCodeCamLib   : 124,
            versionNameCamLib   : "1.2.4",
            //
            minSdkVer           : 23,// 最低支持Android版本
            targetSdkVer        : 30,// 目标版本(和刘工SDK的版本保持一致，避免一些兼容问题)
            //
            ndkVersion          : "21.1.6352462",
    ]

    //=== 公共的(系统提供)
    roots = [
            //项目基本的(每个项目需要的)
            "appcompat"       : "androidx.appcompat:appcompat:1.3.0",
            "material"        : "com.google.android.material:material:1.4.0",
            "constraintlayout": "androidx.constraintlayout:constraintlayout:2.0.4",
            "junit"           : "junit:junit:4.13.2",
            "ext-junit"       : "androidx.test.ext:junit:1.1.3",
            "espresso-core"   : "androidx.test.espresso:espresso-core:3.4.0",
    ]

    //=== 第三方框架
    thirdFrame = [
            // butterknife
            // https://github.com/JakeWharton/butterknife
            "butterknife"         : "com.jakewharton:butterknife:10.2.3",
            "butterknife-compiler": "com.jakewharton:butterknife-compiler:10.2.3",

    ]
}